<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List | JavaScript Crash Course</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-container">
        <div class="todo-card">
            <h1>📝 Daily Task List</h1>
            <p class="subtitle">Add your tasks and manage them with peace of mind.</p>

            <div class="input-row">
                <input id="taskInput" type="text" placeholder="e.g., Practice JavaScript" />
                <button id="addBtn">Add</button>
            </div>

            <ul id="taskList">
                <!-- <li><span class="task-text">Practice JavaScript</span><button class="delete-btn">Delete</button></li> -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
